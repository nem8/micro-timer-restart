name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      # Surface compiler errors as an annotation so they show on the run page
      - name: Report build errors
        if: failure()
        run: |
          msg=$(grep -E '^e: |error:|What went wrong' -A4 build.log | head -80 \
            | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::error title=Gradle build failed::${msg:-see build log}"

      - uses: actions/upload-artifact@v4
        with:
          name: micro-timer-restart-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publish a GitHub Release once per version (versionName in
      # app/build.gradle.kts), only for builds signed with the fixed key.
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_PASSWORD != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if gh release view "v$ver" >/dev/null 2>&1; then
            echo "Release v$ver already exists; skipping"
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk MicroTimerPlus.apk
          git log -1 --format=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md
          gh release create "v$ver" MicroTimerPlus.apk \
            --title "Micro Timer+ $ver" --notes-file notes.md --latest
